name: Mutation testing

# On a PR: the classes it changed must have a mutation score of at least MUTATION_MIN.
# Nightly: the whole codebase, as a report for the quality trend (never fails).

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Mutation gate on changed classes
        if: github.event_name == 'pull_request'
        run: bash scripts/quality/mutation.sh "origin/${{ github.base_ref }}"

      - name: Mutation report on the whole codebase
        if: github.event_name != 'pull_request'
        run: bash scripts/quality/mutation.sh --all "origin/${{ github.event.repository.default_branch }}"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/reports/pitest/
          if-no-files-found: ignore
