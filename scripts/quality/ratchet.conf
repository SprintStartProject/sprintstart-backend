# sprintstart-backend settings for ratchet.sh and the ai-guard hooks.
# Paths are git pathspecs relative to the repository root.

SOURCE_PATHS=('src/main')
TEST_PATHS=('src/test')

# Any way of silencing a finding.
SUPPRESSION_RE='@(file:)?Suppress(Warnings)?\(|ktlint-disable|detekt:disable'

# Tests switched off.
SKIP_RE='@Disabled\b'

# Ids passed around as bare UUID/String in services and controllers.
RAWID_RE='\b[a-z][A-Za-z]*Id: (UUID|String)\b'
RAWID_PATHS=(':(glob)src/main/**/service/**' ':(glob)src/main/**/controller/**')

# Dependencies logic reaches for instead of taking (inject a Clock or an id generator).
HIDDEN_DEPS_RE='(Instant|LocalDate|LocalDateTime|OffsetDateTime|ZonedDateTime)\.now\(\)|UUID\.randomUUID\(\)|System\.currentTimeMillis\(\)|Math\.random\(\)|\bRandom\('

# File length.
FILE_LIMIT=400
SIZE_PATHS=(':(glob)src/main/**/*.kt')

# Lint baselines, which may only shrink.
LINT_BASELINES=('detekt-baseline.xml' 'detekt-baseline-main.xml'
    'src/test/resources/architecture/known-module-violations.txt'
    'src/test/resources/architecture/known-controller-repositories.txt'
    'src/test/resources/architecture/known-controller-branching.txt'
    'src/test/resources/architecture/known-joined-function-names.txt'
    'src/test/resources/architecture/known-raw-id-parameters.txt')

# Configuration that decides what is checked.
PROTECTED=('detekt.yml' '.editorconfig' '.github/workflows' 'scripts/quality' 'scripts/ai-guard'
    '.claude/settings.json' 'AI_RULES.md')

# Comments that narrate history (warning only).
HISTORY_RE='(//|/?\*).*\b([Uu]sed to|[Nn]o longer|[Pp]reviously|the whole change|this change|after the fix|before the fix)\b'
# Comments that cite the rules (failure).
RULE_CITATION_RE='AI_RULES'

# Coverage (scripts/quality/coverage-gate.sh) — `./gradlew test jacocoTestReport` writes the report.
COVERAGE_REPORT='build/reports/jacoco/test/jacocoTestReport.xml'
COVERAGE_FORMAT='jacoco'
COVERAGE_SRC_ROOTS='src/main/kotlin'
DIFF_COVERAGE_MIN=80

# Duplication and dead code (scripts/quality/metrics.sh). Unused code is detekt's job here
# (UnusedPrivateMember & co. in the detekt baselines), so there is no separate dead-code count.
DUPLICATION_PATHS=('src/main')
DUPLICATION_FORMATS='kotlin'
DUPLICATION_IGNORE=''
DEADCODE_CMD=''

# Mutation testing (scripts/quality/mutation.sh) with PIT on the classes a branch changed.
MUTATION_FILES=(':(glob)src/main/kotlin/**/*.kt')
MUTATION_MIN=60
# Lines mutation.sh does not count as added code: line comments and the lines of block and KDoc comments.
COMMENT_LINE_RE='^[[:space:]]*(//|/[*]|[*])'
MUTATION_REPORT='build/reports/pitest/mutations.xml'

run_mutation() {
    local targets
    targets=$(printf '%s\n' "$@" | sed -E 's|^src/main/kotlin/||; s|\.kt$|*|; s|/|.|g' | paste -sd, -)
    rm -f "$MUTATION_REPORT"
    ./gradlew pitest -PpitTargets="$targets" --console=plain -q
}

# Every mutant that survived or had no test reaching it counts against the score.
mutation_counts() {
    [ -f "$MUTATION_REPORT" ] || { echo "0 0"; return; }
    echo "$(grep -c "detected='true'" "$MUTATION_REPORT") $(grep -c '<mutation ' "$MUTATION_REPORT")"
}

# Contract copies this repository consumes (scripts/quality/contracts-sync.sh).
CONTRACT_COPIES=('contracts/agent-stream-events.schema.json|sprintstart-ai|contracts/agent-stream-events.schema.json'
    'contracts/examples/agent-stream|sprintstart-ai|contracts/examples/agent-stream')
